[project]
name = "beets-web-manager"
version = "0.1.0"
description = "A web-based UI for managing music libraries with beets"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.0",
    "celery[redis]>=5.3.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    "beets>=1.6.0",
    "musicbrainzngs>=0.7.1",  # MusicBrainz link resolver; beets 2.x no longer pulls it in
    "python-slugify>=8.0.0",
    "pyyaml>=6.0.0",
    "mutagen>=1.47.0",
    "sse-starlette>=2.0.0",
]

[project.optional-dependencies]
# Mirror of requirements-dev.txt. Keep them in sync.
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=23.12.0",
    "mypy>=1.8.0",
    "httpx>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
